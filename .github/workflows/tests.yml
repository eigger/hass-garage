name: Tests
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "29 4 * * 1"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  current:
    uses: eigger/hass-repo-standards/.github/workflows/python-tests.yml@8bf07f496b4688f64d71980e2c36696751be91fb # reviewed standards commit
    with:
      domain: garage
      python-versions: '["3.14"]'
      lint-python-version: '3.14'
      requirements: requirements_test.txt
      expected-ha-version: '2026.10.2'
      test-profile: ha
      ha-components: 'button device_tracker sensor'
      pytest-args: tests/components/garage/ -v
  minimum-ha:
    uses: eigger/hass-repo-standards/.github/workflows/python-tests.yml@8bf07f496b4688f64d71980e2c36696751be91fb # reviewed standards commit
    with:
      domain: garage
      python-versions: '["3.13"]'
      lint-python-version: '3.14'
      requirements: requirements_test_min.txt
      expected-ha-version: '2025.3.0'
      test-profile: ha
      ha-components: 'button device_tracker sensor'
      pytest-args: tests/components/garage/ -v
